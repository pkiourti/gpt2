[project]
name = "gpt2"
version = "0.1.0"
description = "GPT-2 small implemented from scratch (ARENA), with sampling and training on TinyStories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "tqdm",
    "transformer-lens>=3.9,<4",
    "transformers",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
